[package]
name = "rim_sim"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oddurs/rim"

[dependencies]
hecs = { version = "0.11", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
mlua = { version = "0.12", features = ["luau"] }
serde_path_to_error = "0.1.20"
libm = { version = "0.2.16", default-features = false }
rmp-serde = "1.3.1"
zstd = "0.14.0"
