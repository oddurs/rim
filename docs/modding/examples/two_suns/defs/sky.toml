# Two suns and a green moon. Each is a [[sky_body]] with an orbit, which the
# sim works out where it is from, and a `daylight` term, which reads how far
# up it is: so its light follows where it stands, not the clock. Weather
# sets `cloud`, and core's `light` is daylight dimmed by cloud, so these
# suns dim in a storm without naming the weather.

[[patch]]
target = "field/core:daylight"

# Core's sun, gone.
[patch.set.ambient.sun]
scale = 0.0

# Core's moon, gone too: its term reads the moon body this mod removes
# (below), so the term goes with it, inputs and all.
[patch.set.ambient.moon]
scale = 0.0
of = []

# A red sun, dim, highest at 10:00.
[patch.set.ambient.red_sun]
scale = 40.0
of = [{ input = "body", body = "two_suns:red_sun", of = "up" }]

# A white sun, highest at 16:00. Together they stay within daylight's 0 to
# 100.
[patch.set.ambient.white_sun]
scale = 60.0
of = [{ input = "body", body = "core:sun", of = "up" }]

# A green moon, full every eight days. Like core's moon it lights the sim:
# a daylight term, so plants grow a little by it. It laps nothing, so its
# phase is its own; a quarter-day offset makes it full at midnight, since
# the game starts at 06:00.
[patch.set.ambient.green_moon]
scale = 12.0
of = [
  { input = "body", body = "two_suns:green_moon", of = "up" },
  { input = "body", body = "two_suns:green_moon", of = "phase" },
]

# Core's sun body is the white sun now; the red sun and green moon are
# bodies of their own. The brightest cast shadows, as many as the lighting
# preset allows.
[[patch]]
target = "sky_body/core:sun"
set = { term = "white_sun", transit = 16.0 }

# One moon, the green one: core's goes.
[[patch]]
target = "sky_body/core:moon"
remove = true

[[sky_body]]
id = "red_sun"
field = "core:daylight"
term = "red_sun"
transit = 10.0
color = "#ff9a70"
angular_size = 1.2

[[sky_body]]
id = "green_moon"
field = "core:daylight"
term = "green_moon"
transit = 1.0
phase_days = 8.0
phase_offset = 0.25
color = "#7dffa0"
angular_size = 2.0

# The moon's light is green, as strong as it is up and lit. A tint of its
# own, so core's dawn, dusk and overcast tints stay.
[[patch]]
target = "sky/core:core"

[patch.set.tint.green_moon]
scale = 0.5
color = "#7dffa0"
of = [
  { input = "body", body = "two_suns:green_moon", of = "up" },
  { input = "body", body = "two_suns:green_moon", of = "phase" },
]
