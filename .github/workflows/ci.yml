name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install client system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Clippy
        run: cargo clippy --release --workspace --all-targets
      - name: Test (includes the determinism test)
        run: cargo test --release --workspace
      - name: Headless soak, 3 in-game days
        run: cargo run --release -p rim_sim --example headless -- --days 3 --seed 1

  roadmap:
    name: Roadmap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cairn
        run: |
          curl -fsSL https://raw.githubusercontent.com/oddurs/cairn/main/install.sh | CAIRN_VERSION=0.2.1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate items against the schema
        run: cairn check
      - name: ROADMAP.md is up to date
        run: |
          cairn render -q
          git diff --exit-code ROADMAP.md
