name: CI

# Lanes (DESIGN.md §8a). `scripts/ci-plan` picks one per run:
#
# - pr       a PR push: Linux only. Cancelled by the next push.
# - queue    the full proof, every platform, on the exact result that lands:
#            the merge queue's own PRs, a PR pushed while labelled `full-ci`,
#            or by hand (workflow_dispatch). Not cancelled by another push.
# - nightly  on main: the proof, and the full suites on macOS and Windows.
#            It also saves the caches the other platforms' jobs start from.
# - main     a push to main: the quick checks. The queue already proved it.
# - none     drafts, and labels that change nothing.
#
# Jobs call `scripts/task` verbs, so CI and the laptop run the same gate.
# No `labeled` trigger: a run for a label would skip every job, and a skipped
# check counts as passed under a ruleset. Add `full-ci` before the push, or
# dispatch the queue lane on the branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: queue (the four-platform proof) or nightly (the full suites)
        type: choice
        options: [queue, nightly]
        default: queue

# A PR's pushes cancel each other. The merge queue's own PRs, main, the nightly
# and dispatched runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # CI needs backtraces, not a debugger: smaller caches and faster links.
  CARGO_PROFILE_RELEASE_DEBUG: 0
  # Linking is most of a warm build: 32 integration-test binaries each link
  # the sim and Luau. Rust's own lld links Windows several times faster than
  # link.exe (Linux gets mold from setup-mold; macOS's ld is already fast).
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe
  NEXTEST_PROFILE: ci

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      code: ${{ steps.plan.outputs.code }}
      render: ${{ steps.plan.outputs.render }}
      toolchain: ${{ steps.plan.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          LANE_INPUT: ${{ inputs.lane }}
        run: scripts/ci-plan | tee -a "$GITHUB_OUTPUT"

  # The quick ones, on one runner: formatting, mod scripts against the
  # declared API, and the backlog.
  checks:
    name: Format, types, roadmap
    needs: plan
    if: needs.plan.outputs.lane != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
          components: rustfmt
      - run: scripts/task fmt:check
      # The version scripts/task checks for, so the two can't drift.
      - name: Install luau-lsp
        run: |
          version=$(sed -n 's/^LUAU_LSP_VERSION=//p' scripts/task)
          curl -fsSL -o luau-lsp.zip "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$version/luau-lsp-linux-x86_64.zip"
          unzip -q luau-lsp.zip -d "$RUNNER_TEMP/luau-lsp"
          echo "LUAU_LSP=$RUNNER_TEMP/luau-lsp/luau-lsp" >> "$GITHUB_ENV"
      # `cargo test` (api_types) keeps the declarations in step with the host.
      - run: scripts/task types
      # scripts/task installs the cairn rev it names, once; this keeps it.
      - name: Which cairn
        id: cairn
        run: echo "rev=$(sed -n 's/^CAIRN_REV=//p' scripts/task)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rim/cairn-${{ steps.cairn.outputs.rev }}
          key: cairn-root-${{ steps.cairn.outputs.rev }}
      - run: scripts/task roadmap
      # ROADMAP.md isn't tracked (DESIGN.md §8a): main's is rendered here and
      # kept as the `roadmap` artifact.
      - name: Render the roadmap
        if: needs.plan.outputs.lane == 'main'
        run: ~/.cache/rim/cairn-${{ steps.cairn.outputs.rev }}/bin/cairn render -q --no-hooks
      - name: Upload the roadmap
        if: needs.plan.outputs.lane == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: roadmap
          path: ROADMAP.md
          retention-days: 90
      # The tooling's own tests: the pre-push hook, in throwaway repos.
      - run: scripts/task scripts

  # Clippy over every target, beside the tests: its own cache, since check
  # metadata isn't what the test build leaves.
  lint:
    name: Lint
    needs: plan
    if: contains(fromJSON('["pr","queue","nightly"]'), needs.plan.outputs.lane) && needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
          components: clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install client system libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - run: scripts/task lint

  # Linux runs the whole suite in every lane but main's.
  test:
    name: Test (ubuntu-latest)
    needs: plan
    if: contains(fromJSON('["pr","queue","nightly"]'), needs.plan.outputs.lane) && needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A cold build (after a toolchain bump, before the nightly saves) is most
    # of it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # At night a test that names no seed gets another map (DESIGN.md §7b),
      # so one that quietly depends on its map fails some night, not never.
      - name: The night's seed shift
        if: needs.plan.outputs.lane == 'nightly'
        shell: bash
        run: echo "RIM_SEED_SHIFT=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # One dependency cache, shared with the Linux sim and client jobs;
          # this job builds every target, so it is the one that saves.
          shared-key: release
          # Only main saves: a cache per PR branch filled the 10 GB limit and
          # evicted main's, and the next PR built cold.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Install client system libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      # nextest runs every test binary's tests in parallel, each in its own
      # process. The crate has no doctests; if it gains some, add them.
      - name: Test (includes the determinism test)
        run: scripts/task test
      # Wall-clock budgets, alone on the runner: in the full suite the other
      # tests share the cores and are what the budgets would measure. Linux
      # only: the frame budgets are for a player's machine, and one platform
      # catches a regression in the UI's own work (DESIGN.md §8a).
      - name: UI frame budgets (one test at a time)
        run: scripts/task budgets
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-ubuntu-latest
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The queue's proof off Linux: every platform must reach the same state
  # (DESIGN.md §7), and a save must load and carry on as if never saved.
  proof:
    name: Proof (${{ matrix.os }})
    needs: plan
    if: contains(fromJSON('["queue","nightly"]'), needs.plan.outputs.lane)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Save, load, and carry on
        run: cargo nextest run --release -p rim_sim --test snapshot --test savefile
      - name: Crosscheck scenario
        shell: bash
        run: cargo run --release -p rim_sim --example crosscheck > crosscheck-${{ matrix.os }}.txt && cat crosscheck-${{ matrix.os }}.txt
      # arm64 is where clang fuses multiply-adds (see .cargo/config.toml).
      - name: Luau has no fused multiply-add
        shell: bash
        run: scripts/task fma
      - uses: actions/upload-artifact@v4
        with:
          name: crosscheck-${{ matrix.os }}
          path: crosscheck-${{ matrix.os }}.txt

  # The fourth platform for the crosscheck: ARM Linux.
  crosscheck-arm:
    name: Crosscheck (ubuntu-24.04-arm)
    needs: plan
    if: contains(fromJSON('["queue","nightly"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Save, load, and carry on
        run: cargo nextest run --release -p rim_sim --test snapshot --test savefile
      - name: Run the scenario
        run: cargo run --release -p rim_sim --example crosscheck > crosscheck-ubuntu-24.04-arm.txt && cat crosscheck-ubuntu-24.04-arm.txt
      # arm64 is where clang fuses multiply-adds (see .cargo/config.toml).
      - run: scripts/task fma
      - uses: actions/upload-artifact@v4
        with:
          name: crosscheck-ubuntu-24.04-arm
          path: crosscheck-ubuntu-24.04-arm.txt

  agree:
    name: Every platform reaches the same state
    needs: [plan, sim, proof, crosscheck-arm]
    if: contains(fromJSON('["queue","nightly"]'), needs.plan.outputs.lane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      day: ${{ steps.compare.outputs.day }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crosscheck-*
          merge-multiple: true
      - name: Compare
        id: compare
        shell: bash
        run: |
          ls crosscheck-*.txt
          n=$(ls crosscheck-*.txt | wc -l)
          if [ "$n" -ne 4 ]; then echo "expected 4 platforms, got $n"; exit 1; fi
          first=$(ls crosscheck-*.txt | head -n 1)
          status=0
          for f in crosscheck-*.txt; do
            if ! cmp -s "$first" "$f"; then status=1; fi
          done
          if [ $status -ne 0 ]; then
            # The first day any platform's line differs: the trace jobs
            # below replay it tick by tick on every platform.
            # awk, not diff: diff exits 1 on a difference, which pipefail
            # would take for an error here.
            day=$(for f in crosscheck-*.txt; do
              awk 'NR == FNR { a[FNR] = $0; next } a[FNR] != $0 { print $2; exit }' <(grep '^day' "$first") <(grep '^day' "$f")
            done | sort -n | head -n 1)
            echo "day=$day" >> "$GITHUB_OUTPUT"
            echo "Platforms disagree, first on day $day. First differing day per platform against $first:"
            for f in crosscheck-*.txt; do
              echo "== $f"
              diff "$first" "$f" | head -n 4 || true
            done
            for f in crosscheck-*.txt; do echo "== $f"; cat "$f"; done
            exit 1
          fi
          echo "All $n platforms agree:"
          tail -n 1 "$first"

  # When the platforms disagree: the first day they do, replayed on each with
  # every section's hash after every tick, then compared to name the first
  # tick and the sections that part (DESIGN.md §7).
  trace:
    name: Trace the day (${{ matrix.os }})
    needs: [plan, agree]
    if: failure() && needs.agree.outputs.day != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Trace day ${{ needs.agree.outputs.day }}
        shell: bash
        run: |
          day=${{ needs.agree.outputs.day }}
          cargo run --release -p rim_sim --example crosscheck -- --days "$day" --trace-day "$day" | grep '^tick' > trace-${{ matrix.os }}.txt
          wc -l trace-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.os }}
          path: trace-${{ matrix.os }}.txt

  trace-compare:
    name: The first tick the platforms part
    needs: [plan, trace]
    if: always() && needs.trace.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          pattern: trace-*
          merge-multiple: true
      - name: Compare the traces
        shell: bash
        run: |
          cargo build -q --release -p rim_sim --example traces
          # Its verdict is the step's, after the summary is written.
          status=0
          target/release/examples/traces trace-*.txt > parts.txt || status=$?
          cat parts.txt
          { echo '## Where the platforms part'; echo; echo '```text'; cat parts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # The binaries, the mods through them, the Linux crosscheck and the long
  # sim runs, beside the tests rather than after them.
  sim:
    name: Build, mods, crosscheck, sim runs
    needs: plan
    if: contains(fromJSON('["pr","queue","nightly"]'), needs.plan.outputs.lane) && needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # At night a test that names no seed gets another map (DESIGN.md §7b),
      # so one that quietly depends on its map fails some night, not never.
      - name: The night's seed shift
        if: needs.plan.outputs.lane == 'nightly'
        shell: bash
        run: echo "RIM_SEED_SHIFT=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          # The test job's: it built these dependencies and saves them.
          shared-key: release
          save-if: false
      - name: Install client system libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      # The binaries and examples, which the sim runs below reuse.
      - run: scripts/task build
      # Lockstep: the Luau VM must have no fused multiply-adds (see
      # .cargo/config.toml).
      - run: scripts/task fma
      # Mods' own tests, through the player's binary with no display: `rim
      # test` must never open a window.
      - name: Mod tests and clean loads
        run: scripts/task mods --junit target/rim-test.xml
      - name: Upload the mod test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rim-test-ubuntu-latest
          path: target/rim-test.xml
          if-no-files-found: ignore
      - name: Crosscheck scenario
        run: target/release/examples/crosscheck > crosscheck-ubuntu-latest.txt && cat crosscheck-ubuntu-latest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: crosscheck-ubuntu-latest
          path: crosscheck-ubuntu-latest.txt
      # Soaks with and without plugins (DESIGN.md §5), a year of climate, and
      # DESIGN.md §8's benchmark: fails if the mean tick is over the 2 ms
      # budget (3x slack on shared runners).
      - run: scripts/task sim
      - name: Upload the climate report
        uses: actions/upload-artifact@v4
        with:
          name: climate-report
          path: target/climate-report.txt

  # The client, drawn: Linux renders in software under Xvfb (macOS runners
  # have no OpenGL).
  client:
    name: Client (autotest, render benchmark)
    needs: plan
    if: contains(fromJSON('["pr","queue","nightly"]'), needs.plan.outputs.lane) && needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - name: Install client system libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb libgl1-mesa-dri fontconfig fonts-dejavu-core
      - name: Build the client
        run: cargo build --release -p rim_client
      - name: Client autotest (drives every control, takes screenshots)
        run: xvfb-run -a -s "-screen 0 1600x960x24" target/release/rim --seed 7 --autotest target/autotest
      - name: Upload autotest screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest-screenshots
          path: target/autotest/*.png
          if-no-files-found: ignore
      # DESIGN.md §8: the world renderer's CPU time on the whole bench map, with
      # twenty mods' sprites in it, against its budget (1.5x slack on shared
      # runners). The gate compares means; 100 frames a view holds them.
      # On a PR only when it touches the client or the lockfile: 1000 frames
      # under software GL take ten minutes. The queue runs it on everything.
      - name: Render benchmark, with a budget
        if: needs.plan.outputs.render == 'true'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" target/release/rim --seed 1 --bench-render --frames 100 --sprite-mods 20 --check --json target/render-bench.json --shots target/render-bench
      - name: Upload the render benchmark
        if: always() && needs.plan.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: render-bench
          path: target/render-bench*
          if-no-files-found: ignore

  # Every night, 200 seeds made from the date, each played for two days and
  # round-tripped through a save (DESIGN.md §7b). A failure is filed as a
  # cairn item in the `sweep-items` artifact, with the line that plays the
  # seed again; Actions may not open the PR, so a person or an agent does.
  sweep:
    name: Seed sweep (200 seeds)
    needs: plan
    if: needs.plan.outputs.lane == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - name: Install client system libraries
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev
      - name: Which cairn
        id: cairn
        run: echo "rev=$(sed -n 's/^CAIRN_REV=//p' scripts/task)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rim/cairn-${{ steps.cairn.outputs.rev }}
          key: cairn-root-${{ steps.cairn.outputs.rev }}
      - run: cargo build --release -p rim_client
      - name: Sweep
        id: sweep
        # bash, for pipefail: a failed sweep must fail the step through tee.
        shell: bash
        run: |
          date=$(date -u +%Y%m%d)
          echo "date=$date" >> "$GITHUB_OUTPUT"
          target/release/rim seeds sweep --date "$date" --n 200 --days 2 --jobs 4 --report target/sweep.tsv | tee target/sweep.txt
      - name: File each failure as a cairn item
        if: failure() && steps.sweep.outcome == 'failure'
        run: |
          ids=$(scripts/sweep-items target/sweep.tsv "${{ steps.sweep.outputs.date }}" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          mkdir -p target/sweep-items
          for id in $ids; do cp cairn/items/"$id"*.md target/sweep-items/; done
          {
            echo "## The night's sweep failed"
            echo
            echo "Each failure is a cairn item in the \`sweep-items\` artifact: copy them into \`cairn/items/\` and open a PR."
            echo
            echo '```text'
            cat target/sweep.tsv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweep-items
          path: |
            target/sweep.txt
            target/sweep.tsv
            target/sweep-items/
          if-no-files-found: ignore

  # Every night on main, the whole suite and the long runs on macOS and
  # Windows: what the queue's proof leaves out.
  nightly:
    name: Nightly (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.lane == 'nightly'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # At night a test that names no seed gets another map (DESIGN.md §7b),
      # so one that quietly depends on its map fails some night, not never.
      - name: The night's seed shift
        if: needs.plan.outputs.lane == 'nightly'
        shell: bash
        run: echo "RIM_SEED_SHIFT=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.plan.outputs.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - shell: bash
        run: scripts/task lint
      - shell: bash
        run: scripts/task test
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - shell: bash
        run: scripts/task build
      - shell: bash
        run: scripts/task fma
      - shell: bash
        run: scripts/task mods
      - name: Headless soak, 3 in-game days, and a climate year
        shell: bash
        run: |
          target/release/examples/headless --days 3 --seed 1
          target/release/examples/year --seed 1 > /dev/null
