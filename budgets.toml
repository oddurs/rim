# Performance budgets (DESIGN.md §8, the Bare Metal plan). Each bench's
# `--check` fails over a cap, and docs/engineering/benchmarks.md lists these.
#
# `target` is the goal on the reference machine. `cap` is what CI fails over
# today. A cap only goes down: lower it as work lands. Raising one needs a
# note in its PR saying why.
#
# On CI every time cap (a name ending in `_ms`) is multiplied by the runner
# class's slack, for shared cores and software GL. A class not listed takes
# `ci.slack`; the class is the start of the `machine:` line a bench prints.
# A count of work (`max_nodes`, `nodes_per_search`) is the same on every
# machine and is held to its cap as it is: it catches a slow path search
# when the times drown in a busy machine's noise.

# `cargo run --release -p rim_sim --example bench -- --days 0.25 --check`:
# 250×250, 30 colonists and 200 pawns at work.
# Time caps are about twice what an M4 Pro measured on 2026-09-28; count
# caps are a tenth over it.
[sim.base]
mean_ms = { target = 0.1, cap = 0.2 }
p99_ms = { target = 1.0, cap = 2.0 }
max_ms = { target = 4.0, cap = 12.0 }
max_nodes = { target = 330.0, cap = 350.0 }
nodes_per_search = { target = 10.0, cap = 12.0 }

# The same with `--winter`: a thaw with snow over mud, and hauling. Snow
# and mud make nearly every step dearer than A*'s heuristic assumes, so its
# searches flood: 36,903 nodes the most in a tick, 91 a search.
[sim.winter]
mean_ms = { target = 0.1, cap = 0.3 }
p99_ms = { target = 1.0, cap = 5.0 }
max_ms = { target = 4.0, cap = 120.0 }
max_nodes = { target = 5000.0, cap = 40000.0 }
nodes_per_search = { target = 20.0, cap = 100.0 }

# `rim --bench-render --check`: the §8 world through ten views. Each
# measure is the worst view's: world CPU over the gated views (the whole
# map, a storm, a zoom), the rest over all ten. A real GPU and software GL
# differ about tenfold a frame, so each has its caps; the bench picks by
# the GL renderer it runs on.
#
# gpu: an M4 Pro, window in front, lighting medium, 2026-09-28. Targets are
# the plan's; the caps hold today's lit views (a dug level, moving lights,
# dusk), which run 14-17 ms with 65 ms hitches.
[render.gpu]
world_ms = { target = 2.0, cap = 4.0 }
frame_p99_ms = { target = 16.6, cap = 70.0 }
frame_max_ms = { target = 33.0, cap = 75.0 }
hitches = { target = 0.0, cap = 130.0 }
draw_calls = { target = 60.0, cap = 170.0 }
mesh_change_ms = { target = 1.0, cap = 3.0 }

# software: CI's llvmpipe on AMD EPYC 9V74, 2026-09-28. Its targets are the
# gpu goals as llvmpipe would take them, about ten times the frame. Region
# meshes (#390) took the worst view from 140 draw calls to 65, and a wall's
# repaint and join to 1.96 ms, on EPYC 7763 (2026-09-29).
[render.software]
# The moving view's world time is bimodal on CI, about 0.9 or 4-5 ms for one
# commit (its light pass), so the cap sits above the slow mode.
world_ms = { target = 2.0, cap = 6.0 }
frame_p99_ms = { target = 70.0, cap = 155.0 }
frame_max_ms = { target = 80.0, cap = 165.0 }
hitches = { target = 0.0, cap = 10.0 }
draw_calls = { target = 60.0, cap = 70.0 }
mesh_change_ms = { target = 1.0, cap = 3.0 }

[ci]
slack = 3.0
# The software caps are set on this class, and it plays the sim about as
# fast as the M4 Pro the sim caps come from.
class."AMD EPYC 9V74" = { slack = 1.0, note = "measured 2026-09-28" }
