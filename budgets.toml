# Performance budgets (DESIGN.md §8, the Bare Metal plan). Each bench's
# `--check` fails over a cap, and docs/engineering/benchmarks.md lists these.
#
# `target` is the goal on the reference machine. `cap` is what CI fails over
# today. A cap only goes down: lower it as work lands. Raising one needs a
# note in its PR saying why.
#
# On CI every time cap (a name ending in `_ms`) is multiplied by the runner
# class's slack, for shared cores and software GL. A class not listed takes
# `ci.slack`; the class is the start of the `machine:` line a bench prints.
# A count of work (`max_nodes`, `nodes_per_search`) is the same on every
# machine and is held to its cap as it is: it catches a slow path search
# when the times drown in a busy machine's noise.

# `cargo run --release -p rim_sim --example bench -- --days 0.25 --check`:
# 250×250, 30 colonists and 200 pawns at work.
# Time caps are about twice what an M4 Pro measured on 2026-09-28; count
# caps are a tenth over it.
[sim.base]
mean_ms = { target = 0.1, cap = 0.2 }
p99_ms = { target = 1.0, cap = 2.0 }
max_ms = { target = 4.0, cap = 12.0 }
max_nodes = { target = 330.0, cap = 350.0 }
nodes_per_search = { target = 10.0, cap = 12.0 }

# The same with `--winter`: a thaw with snow over mud, and hauling. Snow
# and mud make nearly every step dearer than A*'s heuristic assumes, so its
# searches flood: 36,903 nodes the most in a tick, 91 a search.
[sim.winter]
mean_ms = { target = 0.1, cap = 0.3 }
p99_ms = { target = 1.0, cap = 5.0 }
max_ms = { target = 4.0, cap = 120.0 }
max_nodes = { target = 5000.0, cap = 40000.0 }
nodes_per_search = { target = 20.0, cap = 100.0 }

[ci]
slack = 3.0
