[workspace]
resolver = "2"
members = ["crates/rim_sim", "crates/rim_ui", "crates/rim_client"]

# Build profiles. Reasoning and measurements: docs/engineering/dependencies.md.
#
#   cargo run -p rim_client                 dev: fast rebuilds, optimised dependencies
#   cargo run --release -p rim_client       release: what CI tests and you play
#   cargo prof                              profiling: release + full symbols
#   cargo dist                              dist: what ships (LTO, one codegen unit)
#
# panic stays "unwind" everywhere: mlua turns a panic in a Rust callback into
# a Lua error, so a broken mod reports an error instead of killing the game.

[profile.dev]
opt-level = 1
# Line tables give backtraces with line numbers at a fraction of full debug
# info's disk and link cost. Set `debug = true` locally to step in a debugger.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies' debug info is most of target/'s size.
debug = false

[profile.release]
debug = "line-tables-only"

[profile.release.package."*"]
debug = false

[profile.profiling]
inherits = "release"
debug = true

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
# macOS: a packed .dSYM beside the binary, for symbolicating crash reports.
split-debuginfo = "packed"
strip = "debuginfo"
