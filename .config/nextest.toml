# cargo-nextest: every test in its own process, all binaries in parallel.
# Locally: `cargo nextest run --release --workspace`. CI uses the `ci`
# profile below.

[profile.ci]
# Run everything and report every failure, not the first.
fail-fast = false
# No retries: a test that needs one is a flake to fix, not to hide.
retries = 0
# A test past a minute is reported as slow, and killed at three.
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
