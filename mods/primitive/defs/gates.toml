# Core's heavy work, gated behind the tools (DESIGN.md §4e). Core alone
# gates nothing; with the stone age on, a bare-handed colonist gathers, and
# an oak waits for an axe. The toolbar still marks them: the thing says
# what it needs ("Needs a chopping tool.").

# The oak has two harvests (gather, from wild.toml, and core's chop), so
# `edit` names the one it means.
[[patch]]
target = "thing/core:tree_oak"

[[patch.edit]]
list = "harvest"
match = { designation = "chop" }
set = { requires = ["chopping"] }

[[patch]]
target = "thing/core:granite"
set = { harvest = { requires = ["pounding"] } }

# The levels below (DESIGN.md §6d): soft ground takes a digging stick, and
# stone a maul. Nothing gates granite deeper down beyond what gates it on
# the surface, until metal picks exist.
[[patch]]
target = "thing/core:packed_earth"
set = { harvest = { requires = ["digging"] } }

[[patch]]
target = "thing/core:clay_bed"
set = { harvest = { requires = ["digging"], yields = [{ thing = "primitive:clay", count = 4 }] } }

[[patch]]
target = "thing/core:chalk"
set = { harvest = { requires = ["digging"], yields = [{ thing = "core:chalk_blocks", count = 6 }, { thing = "primitive:flint", count = 1 }] } }

[[patch]]
target = "thing/core:limestone"
set = { harvest = { requires = ["pounding"] } }

[[patch]]
target = "thing/core:wet_limestone"
set = { harvest = { requires = ["pounding"] } }
