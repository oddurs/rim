# Stone-age tools, made at a crafting spot (mods/crafting). A tool knapped
# from flint is made of flint: its hp and speed come from the material, so
# a bone hand axe is the same def, only worse (DESIGN.md §4e).
#
# The ladder: a hammerstone shaped from a stone knaps flint into a flake
# and a hand axe. Fibre twists into cordage by hand. An edge cuts a branch
# into a haft or a digging stick, and hafted, the axe and the maul make
# felling and quarrying worth doing.

[[thing]]
id = "hammerstone"
label = "hammerstone"
color = "#9a948a"
category = "item"
look.layers = [
    { draw = "disc", x = 0.5, y = 0.56, r = 0.26, color = "#00000030" },
    { draw = "disc", x = 0.48, y = 0.5, r = 0.24 },
    { draw = "disc", x = 0.4, y = 0.42, r = 0.08, shade = 1.25 },
]
hp = 200
market_value = 1
tool = { tags = ["pounding"], speed = 0.4 }

[[thing]]
id = "flake"
# The material names it: a flint flake, a bone flake.
label = "flake"
color = "#56626f"
category = "item"
