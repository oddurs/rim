# ─── Recipes, at any crafting spot ──────────────────────────────────────────

[[crafting.recipe]]
id = "hammerstone"
label = "hammerstone"
station = "crafting:hand"
inputs = [{ thing = "stones", count = 1 }]
outputs = [{ thing = "hammerstone" }]
work = 60

[[crafting.recipe]]
id = "flake"
label = "flake"
station = "crafting:hand"
inputs = [{ tag = "knappable", count = 1 }]
outputs = [{ thing = "flake" }]
work = 150
requires = ["pounding"]

[[crafting.recipe]]
id = "hand_axe"
label = "hand axe"
station = "crafting:hand"
inputs = [{ tag = "knappable", count = 2 }]
outputs = [{ thing = "hand_axe" }]
work = 300
requires = ["pounding"]

[[crafting.recipe]]
id = "cordage"
label = "cordage"
station = "crafting:hand"
inputs = [{ tag = "fibre", count = 3 }]
outputs = [{ thing = "cordage" }]
work = 120

# The head is knapped flint (first, so the axe is made of it), on a branch
# haft, lashed with cordage.
[[crafting.recipe]]
id = "hafted_axe"
label = "hafted axe"
station = "crafting:hand"
inputs = [
    { tag = "knappable", count = 2 },
    { tag = "branch", count = 1 },
    { thing = "cordage", count = 1 },
]
outputs = [{ thing = "hafted_axe" }]
work = 450
requires = ["cutting"]

[[crafting.recipe]]
id = "maul"
label = "stone maul"
station = "crafting:hand"
inputs = [
    { thing = "stones", count = 3 },
    { tag = "branch", count = 1 },
    { thing = "cordage", count = 1 },
]
outputs = [{ thing = "maul" }]
work = 400
requires = ["cutting"]
stuff = false

[[crafting.recipe]]
id = "digging_stick"
label = "digging stick"
station = "crafting:hand"
inputs = [{ tag = "branch", count = 1 }]
outputs = [{ thing = "digging_stick" }]
work = 150
requires = ["cutting"]
# A stick, not a "branches digging stick", and its own hp.
stuff = false

