# A campfire of branches: the first night needs no axe.
[[patch]]
target = "thing/core:campfire"
set = { build = { cost = [{ thing = "primitive:branches", count = 10 }] } }

# The fire is a station too: a clay pot is fired in it (tools.toml).
[[patch]]
target = "thing/core:campfire"
append = { tags = ["crafting:fire"] }
