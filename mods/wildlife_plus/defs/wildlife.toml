# Tier 1 — data. A new creature; map generation picks it up automatically.
[[creature]]
id = "boar"
label = "boar"
color = "#5a4636"
size = 0.38
speed = 12
max_hp = 80
melee_damage = 8
melee_cooldown = 80
market_value = 70
butcher = [{ thing = "core:raw_meat", count = 30 }]
spawn = { terrain = ["core:dirt", "core:grass"], groups = 2, group = [1, 3] }

# Tier 1 — patches. Change core content without copying it.
[[patch]]
target = "thing/core:berry_bush"
[[patch.edit]]
list = "harvest"
match = { designation = "harvest" }
set = { regrow_days = 1.5 }

# Tier 1 — art. A mod's sprite: sprites/salt_lick.png, packed into the one
# world atlas with every other mod's, drawn as painted over a shadow.
[[thing]]
id = "salt_lick"
label = "salt lick"
color = "#e8e2d6"
category = "building"
path_cost = 60
market_value = 12
build = { menu = "furniture", work = 120, stuff = { category = "structural", count = 6 } }
look.layers = [
    { draw = "disc", x = 0.54, y = 0.84, r = 0.3, color = "#00000030" },
    { draw = "sprite", sprite = "salt_lick", x = 0.1, y = 0.05, w = 0.8, h = 0.8 },
]

# Tier 1 — a glyph. A character as a look, rasterised once at load into the
# world atlas: legible at any zoom, and no art to ship.
[[thing]]
id = "trail_marker"
label = "trail marker"
color = "#d8b04a"
category = "building"
path_cost = 20
market_value = 2
build = { menu = "furniture", work = 40, stuff = { category = "structural", count = 1 } }
look.layers = [
    { draw = "disc", r = 0.3, color = "#00000040" },
    { draw = "glyph", glyph = "▲", size = 0.6, color = "#e6c04e" },
]
