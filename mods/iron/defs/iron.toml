# ─── Iron (DESIGN.md §4f, §6d) ───────────────────────────────────────────────
# The surface's poor, early iron: bog ore dug out of the marsh like clay.
# Deep ore at -3 comes with the depth milestone and smelts the same way.

[[thing]]
id = "bog_iron"
label = "bog iron"
color = "#6b5a3a"
category = "item"
look.layers = [
    { draw = "disc", x = 0.38, y = 0.56, r = 0.16 },
    { draw = "disc", x = 0.6, y = 0.46, r = 0.14, shade = 0.8 },
    { draw = "disc", x = 0.5, y = 0.7, r = 0.1, shade = 1.1 },
]
