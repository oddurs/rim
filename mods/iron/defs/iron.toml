# ─── Nails in timber's builds ────────────────────────────────────────────────
# With iron, a plank wall is planks and a nail, a crate needs nails and a
# shelf its fittings (§4f: a build takes a material and parts).

[[patch]]
target = "thing/timber:plank_wall"
set = { build = { cost = [{ thing = "iron:nails", count = 1 }] } }

[[patch]]
target = "thing/timber:crate"
set = { build = { cost = [{ thing = "iron:nails", count = 4 }] } }

[[patch]]
target = "thing/timber:shelf"
set = { build = { cost = [{ thing = "iron:fittings", count = 1 }] } }

[[patch]]
target = "thing/timber:tool_rack"
set = { build = { cost = [{ thing = "iron:nails", count = 2 }] } }
