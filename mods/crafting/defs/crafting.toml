# Crafting on the engine's work orders (DESIGN.md §4e). A recipe says what
# a station makes, out of what, and how long it takes; a bill on a station
# says how many. The bills script turns the top bill into one order at a
# time and makes the outputs when the order is done.
#
# Other mods add recipes as [[crafting.recipe]] and stations by tagging
# their things; see docs/modding/crafting.md.

[[kind]]
id = "recipe"

[kind.fields]
label = "string"
# A tag: any thing carrying it can make this ("crafting:hand" is anywhere
# with a crafting spot).
station = "string"
# { thing = "id", count = n } or { tag = "t", count = n }, in the order
# they're brought. The first that is a material is what the outputs are
# made of.
inputs = "list"
# { thing = "id", count = n }
outputs = "list"
# Ticks at bare hands' pace, before the station's speed.
work = "float"
# Tool tags: the worker holds a tool with every one.
requires = { type = "list", default = [] }
work_type = { type = "string", default = "crafting:craft" }
# Whether the outputs are made of the first material that went in.
stuff = { type = "bool", default = true }

# How fast a station works, where it isn't 1.
[[kind]]
id = "station"

[kind.fields]
thing = "string"
speed = "float"

# Better with practice: a trained crafter works faster (DESIGN.md §4d).
[[skill]]
id = "crafting"
label = "Crafting"

[[work_type]]
id = "craft"
label = "Craft"
icon = "R"
skill = "crafting"
priority = 3
order = 45
auto = { per_person = 2, weight = 2 }

# A crew for the benches, and builders who craft when nothing else waits
# (DESIGN.md §4d).
[[work_role]]
id = "crafter"
label = "Crafter"
order = 40
priorities = { craft = 1, "core:chop" = 2, "core:haul" = 3 }

[[patch]]
target = "work_role/core:builder"

[patch.set.priorities]
"crafting:craft" = 4

# A patch of ground marked for handwork. Free, like a campfire without the
# fire, so that every recipe has a station and the cheapest costs nothing.
[[thing]]
id = "spot"
label = "crafting spot"
color = "#b39b72"
category = "building"
# Marked out on the plan as a dashed ring, with the chips of work in it.
look.layers = [
    { draw = "disc", r = 0.36, color = "#00000026" },
    { draw = "arc", r = 0.36, from = 0, to = 36, line = "light", color = "#ffffff8c" },
    { draw = "arc", r = 0.36, from = 60, to = 96, line = "light", color = "#ffffff8c" },
    { draw = "arc", r = 0.36, from = 120, to = 156, line = "light", color = "#ffffff8c" },
    { draw = "arc", r = 0.36, from = 180, to = 216, line = "light", color = "#ffffff8c" },
    { draw = "arc", r = 0.36, from = 240, to = 276, line = "light", color = "#ffffff8c" },
    { draw = "arc", r = 0.36, from = 300, to = 336, line = "light", color = "#ffffff8c" },
    { draw = "disc", x = 0.4, y = 0.46, r = 0.06, shade = 0.8 },
    { draw = "disc", x = 0.6, y = 0.56, r = 0.07, shade = 0.7 },
    { draw = "disc", x = 0.54, y = 0.38, r = 0.045 },
]
hp = 30
tags = ["crafting:hand"]
build = { menu = "production", work = 20, free = true }

# A bench with a place to stand in front: handwork, faster, and the bench
# recipes that need a surface.
[[thing]]
id = "workbench"
label = "workbench"
color = "#94704c"
category = "building"
# Its top from above: a vice at one end and the marks of the tools laid on
# it. Whoever works it stands on the south side.
look.layers = [
    { draw = "box", x = 0.06, y = 0.12, w = 0.88, h = 0.7, round = 0.05, shade = 1.08 },
    { draw = "box", x = 0.14, y = 0.22, w = 0.24, h = 0.22, round = 0.03, shade = 0.62 },
    { draw = "line", start = [0.5, 0.34], end = [0.68, 0.34], line = "hair", shade = 0.55 },
    { draw = "line", start = [0.76, 0.26], end = [0.76, 0.6], line = "hair", shade = 0.55 },
    { draw = "line", start = [0.5, 0.52], end = [0.66, 0.68], line = "hair", shade = 0.55 },
]
blocks = true
hp = 150
market_value = 30
tags = ["crafting:hand", "crafting:bench"]
spots = [{ dx = 0, dy = 1 }]
build = { menu = "production", work = 400, stuff = { category = "structural", count = 20 } }

[[station]]
id = "workbench"
thing = "crafting:workbench"
speed = 1.5

# A room with somewhere to do handwork in it is a workshop (DESIGN.md §6c).
[[room_role]]
id = "workshop"
label = "Workshop"
needs = { "crafting:hand" = 1 }
