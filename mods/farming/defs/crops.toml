# Farming (DESIGN.md §4c): a growing zone names a crop, and the engine lays
# the crop's plan on each empty cell while it would grow there. Colonists
# who sow raise those plans as seedlings; the crop grows with the weather,
# and when grown it is marked for harvest, which takes it up whole.

# Setting a crop's seedlings out on a growing zone.
[[work_type]]
id = "sow"
label = "Sow"
icon = "S"
skill = "core:plants"
priority = 3
order = 35
auto = { per_person = 6, weight = 3 }

[[thing]]
id = "potatoes"
label = "potatoes"
color = "#b48a55"
category = "item"
look.layers = [
    { draw = "disc", x = 0.38, y = 0.44, r = 0.2 },
    { draw = "disc", x = 0.62, y = 0.58, r = 0.18, shade = 0.85 },
]
market_value = 1.2
stack_limit = 60
food = { nutrition = 0.1 }

[[thing]]
id = "flax"
label = "flax"
color = "#c9b98a"
category = "item"
tags = ["fiber"]
look.layers = [
    { draw = "fill", x = 0.3, y = 0.15, w = 0.12, h = 0.7 },
    { draw = "fill", x = 0.5, y = 0.15, w = 0.12, h = 0.7, shade = 0.9 },
]
market_value = 1.0
stack_limit = 60

# A week of good summer weather from seedling to crop. Tender: a hard
# frost kills it, so it's sown after the last one.
[[thing]]
id = "potato_plant"
label = "potato plant"
color = "#4f7f3a"
category = "plant"
height = 0.3
look.layers = [
    { draw = "disc", r = 0.3 },
    { draw = "disc", x = 0.4, y = 0.42, r = 0.14, shade = 1.2 },
]
path_cost = 20
harvest = { designation = "core:harvest", work = 90, yields = [{ thing = "potatoes", count = 10 }] }
build = { by = "sow", work = 60, free = true }

[thing.grow]
days = 7

[thing.grow.rate.growth]
of = [
  { field = "core:temperature", curve = [[5, 0.0], [12, 0.6], [20, 1.0], [30, 0.8], [35, 0.0]] },
  { field = "core:light", curve = [[0, 0.0], [30, 1.0]] },
  { terrain = "fertility", curve = [[0, 0.0], [0.5, 0.5], [1, 1.0], [1.4, 1.3]] },
  { field = "weather:wetness", curve = [[0, 0.1], [25, 0.6], [45, 1.0], [85, 1.0], [100, 0.6]] },
]

[thing.grow.harm.frost]
of = [{ field = "core:temperature", curve = [[-6, 2.0], [-1, 0.0]] }]

# Flax stands the cold better and wants less of the soil: fibre for cloth.
[[thing]]
id = "flax_plant"
label = "flax"
color = "#6f9a4a"
category = "plant"
height = 0.6
look.layers = [
    { draw = "disc", r = 0.26 },
    { draw = "disc", x = 0.5, y = 0.36, r = 0.08, color = "#7d8fd0" },
]
path_cost = 20
harvest = { designation = "core:harvest", work = 70, yields = [{ thing = "flax", count = 8 }] }
build = { by = "sow", work = 50, free = true }

[thing.grow]
days = 9

[thing.grow.rate.growth]
of = [
  { field = "core:temperature", curve = [[2, 0.0], [10, 0.7], [18, 1.0], [30, 0.8], [35, 0.0]] },
  { field = "core:light", curve = [[0, 0.0], [30, 1.0]] },
  { terrain = "fertility", curve = [[0, 0.2], [0.7, 0.9], [1, 1.0], [1.4, 1.1]] },
  { field = "weather:wetness", curve = [[0, 0.2], [30, 0.8], [50, 1.0], [100, 0.8]] },
]

[thing.grow.harm.frost]
of = [{ field = "core:temperature", curve = [[-10, 1.5], [-4, 0.0]] }]
