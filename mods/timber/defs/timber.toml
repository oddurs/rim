# Raised and clay-sealed: where the harvest goes when farming comes. Food
# keeps three times as long in it.
[[thing]]
id = "granary"
label = "granary"
color = "#b98a55"
category = "building"
size = [2, 2]
look.layers = [
    { draw = "fill", x = 0.03, y = 0.03, w = 0.94, h = 0.94, color = "#a86f4c" },
    { draw = "fill", x = 0.1, y = 0.1, w = 0.8, h = 0.8 },
    { draw = "edges", width = 1.5, shade = 0.55 },
]
hp = 300
market_value = 25
blocks = true
build = { menu = "storage", work = 1200, stuff = { category = "timber", count = 20 }, cost = [{ thing = "primitive:clay", count = 10 }] }
