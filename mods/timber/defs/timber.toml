# ─── Planks (DESIGN.md §4f) ──────────────────────────────────────────────────
# The material that makes containers and better walls, hewn from a log with
# an axe: slow, and one to a log. Nothing here needs iron; where the iron
# plugin is installed it adds a saw pit (two planks to a log, twice as
# fast) and nails.

[[thing]]
id = "planks"
label = "planks"
color = "#b98a55"
category = "item"
look.layers = [
    { draw = "fill", x = 0.16, y = 0.24, w = 0.68, h = 0.14 },
    { draw = "fill", x = 0.16, y = 0.43, w = 0.68, h = 0.14, shade = 1.1 },
    { draw = "fill", x = 0.16, y = 0.62, w = 0.68, h = 0.14, shade = 0.9 },
]
market_value = 2.5
stack_limit = 75
tags = ["timber"]
# Thinner than a log: less wood to a wall, quicker up, a little draughtier.
# `span` scales how far a wall of it holds a roof up (DESIGN.md §6c): as
# far as logs.
stuff = { categories = ["structural", "timber"], factors = { hp = 0.9, work = 0.6, insulation = 0.8, flammability = 2.5, beauty = 1.3, span = 1.0 }, look = { pattern = "planks", floor = "planks", roof = "shingle" } }

# Once there are planks, core's wood reads as what it is.
[[patch]]
target = "thing/core:wood"
set = { label = "logs" }

[[crafting.recipe]]
id = "hew_planks"
label = "hew planks"
station = "crafting:hand"
inputs = [{ thing = "core:wood", count = 1 }]
outputs = [{ thing = "planks" }]
work = 600
requires = ["chopping"]
stuff = false

# ─── Walls ───────────────────────────────────────────────────────────────────

# Three planks to a length where a log wall takes five: the wood goes
# further, it goes up faster, and it looks finished.
[[thing]]
id = "plank_wall"
blocks_wind = 1.0
label = "plank wall"
color = "#b98a55"
category = "building"
look.join = { group = "wall", round = 0.22 }
look.layers = [{ draw = "mass", grow = [0.0, 0.85] }, { draw = "edges", width = 1.5, shade = 0.55, grow = [0.85, 1.0] }]
blocks = true
hp = 200
market_value = 10
build = { menu = "structure", work = 180, stuff = { category = "timber", count = 3 } }
boundary = [{ field = "core:temperature", leak = 1.0 }]
# Holds the roof up as core's wall does: 4 cells, times planks' span.
support = { span = 4 }

# ─── Storage ─────────────────────────────────────────────────────────────────

