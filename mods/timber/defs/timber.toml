category = "building"
look.layers = [
    { draw = "fill", x = 0.08, y = 0.08, w = 0.84, h = 0.84 },
    { draw = "outline", x = 0.08, y = 0.08, w = 0.84, h = 0.84, width = 1.5, shade = 0.55 },
    { draw = "fill", x = 0.46, y = 0.1, w = 0.08, h = 0.8, shade = 0.7 },
]
hp = 120
market_value = 8
blocks = true
build = { menu = "storage", work = 400, stuff = { category = "timber", count = 6 } }
