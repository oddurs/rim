# How the renderer colours light. The simulation only knows how bright it is
# (the `light` field); colour is the renderer's business.
#
# Tints are keyed by label, so a sky mod adds one (a green moon) with a
# patch instead of reshaping these. Each is a colour and a strength from 0 to
# 1, written as terms over the hour, the year and outdoor values.

[[sky]]
id = "core"
# The darkest the world gets.
night = "#4a5478"
# Firelight.
firelight = "#ffb060"
# Daylight a roofed room gets through its walls and door; each window adds
# its boundary pass (the light field's), so a room with windows is brighter.
indoor_share = 0.2

[sky.tint.dawn]
color = "#ffa066"
of = [{ input = "hour", curve = [[4.5, 0.0], [6.0, 0.45], [8.0, 0.0]] }]

[sky.tint.dusk]
color = "#d0709a"
of = [{ input = "hour", curve = [[17.5, 0.0], [19.5, 0.45], [21.0, 0.0]] }]

# Overcast light is cold and grey.
[sky.tint.overcast]
color = "#8a98b0"
of = [{ ambient = "cloud", curve = [[40, 0.0], [100, 0.4]] }]

# The bodies in the sky. The sim works out where each is from its orbit;
# the renderer lights the world from there, in each one's colour, with
# shadows as soft as it is wide. How bright the sun is, is a term of the
# daylight field, the sim's light. The brightest cast shadows, as many as
# the lighting preset allows.

# The sun: warm white, half a degree across.
[[sky_body]]
id = "sun"
field = "daylight"
term = "sun"
color = "#fff6e8"
angular_size = 0.5
# Its orbit, for the sim: highest at noon, and 23° north of the equator at
# midsummer, as far south at midwinter.
tilt = 23.0

# The moon: cold, and wider for its halo. Its light is daylight's `moon`
# term, the sim's as well as the picture's, so plants grow a little by a
# full moon; cloud dims it as it dims the sun.
[[sky_body]]
id = "moon"
field = "daylight"
term = "moon"
color = "#aebfff"
angular_size = 1.5
# Its orbit: it laps the sun once a phase cycle, 15/14 of a day between
# crossings, so it rises 1.7 hours later each day, and full moons are highest
# at midnight, the first after the first night. Opposite the sun, a full moon
# rides high in winter and low in summer.
day_period = 1.0714286
transit = 24.0
tilt = -23.0
phase_days = 15.0
phase_offset = 6.75
