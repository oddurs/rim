# How the renderer colours light. The simulation only knows how bright it is
# (the `light` field); colour is the renderer's business.
#
# Tints are keyed by label, so a sky mod adds one (a green moon) with a
# patch instead of reshaping these. Each is a colour and a strength from 0 to
# 1, written as terms over the hour, the year and outdoor values.

[[sky]]
id = "core"
# The darkest the world gets.
night = "#4a5478"
# Firelight.
firelight = "#ffb060"
# Daylight a roofed room gets through its walls and door; each window adds
# its boundary pass (the light field's), so a room with windows is brighter.
indoor_share = 0.2

[sky.tint.dawn]
color = "#ffa066"
of = [{ input = "hour", curve = [[4.5, 0.0], [6.0, 0.45], [8.0, 0.0]] }]

[sky.tint.dusk]
color = "#d0709a"
of = [{ input = "hour", curve = [[17.5, 0.0], [19.5, 0.45], [21.0, 0.0]] }]

# Overcast light is cold and grey.
[sky.tint.overcast]
color = "#8a98b0"
of = [{ ambient = "cloud", curve = [[40, 0.0], [100, 0.4]] }]

# The bodies the renderer lights the world from: where each crosses the
# sky, its colour, and how soft its shadows are. How bright the sun is, is
# a term of the daylight field, the sim's light. The brightest cast
# shadows, as many as the lighting preset allows.

# Up with its term at 05:00, down at 21:00, 60° at its highest, rising in
# the east (0°) and setting a little north of west (190°, the map's y grows
# south).
[[sky_body]]
id = "sun"
field = "daylight"
term = "sun"
rise = 5.0
set = 21.0
peak = 60.0
arc = [-10.0, 190.0]
color = "#fff6e8"
angular_size = 0.5
# Its orbit, for the sim: highest at noon, and 23° north of the equator at
# midsummer, as far south at midwinter.
tilt = 23.0

# Across the night from the east as the sun does, lower, cold, and wider
# for its halo. Its light is the picture's alone: the sim's stays dark at
# night, so nothing grows by it. Full every 15 days, four times a year, and
# on the first night; faint beside the sun, in the light field's units, and
# dimmed by cloud as the sun is.
[[sky_body]]
id = "moon"
scale = 1.5
of = [
  { input = "hour", curve = [[0, 1.0], [4, 1.0], [5.5, 0.0], [19.5, 0.0], [21, 1.0], [24, 1.0]] },
  { input = "cycle", days = 15, offset = 6.75, curve = [[0, 0.0], [0.5, 1.0], [1, 0.0]] },
  { ambient = "cloud", curve = [[0, 1.0], [100, 0.55]] },
]
rise = 19.5
set = 5.5
peak = 45.0
arc = [20.0, 160.0]
color = "#aebfff"
angular_size = 1.5
# Its orbit: it laps the sun once a phase cycle, 15/14 of a day between
# crossings, so it rises 1.7 hours later each day, and full moons are highest
# at midnight, the first after the first night. Opposite the sun, a full moon
# rides high in winter and low in summer.
day_period = 1.0714286
transit = 24.0
tilt = -23.0
phase_days = 15.0
phase_offset = 6.75
