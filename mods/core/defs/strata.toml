# ------------------------------------------------------------ digging down

# No floor: a pit, a shaft. Nothing walks it; light and water fall
# through it to the level below.
[[terrain]]
id = "air"
label = "open pit"
color = "#1c1b1f"
air = true

# Dug down a level: the cell below is mined out first, with the work and
# the tool its rock asks, then the steps go in. Both cells are the stairs.
[[thing]]
id = "stairs"
label = "stairs"
color = "#8a7d6b"
category = "building"
# As a plan draws a stair: its treads, and an arrow the way it goes from
# the level you're on, DN at the top, UP at the bottom. The top also has
# the break line where the plan cuts through the flight.
