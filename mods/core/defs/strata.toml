# ------------------------------------------------------------ digging down

# No floor: a pit, a shaft. Nothing walks it; light and water fall
# through it to the level below.
[[terrain]]
id = "air"
label = "open pit"
color = "#1c1b1f"
air = true

# Dug down a level: the cell below is mined out first, with the work and
# the tool its rock asks, then the steps go in. Both cells are the stairs.
[[thing]]
id = "stairs"
label = "stairs"
color = "#8a7d6b"
category = "building"
look.layers = [
    { draw = "fill", x = 0.1, y = 0.08, w = 0.8, h = 0.16 },
    { draw = "fill", x = 0.1, y = 0.32, w = 0.8, h = 0.16, shade = 0.85 },
    { draw = "fill", x = 0.1, y = 0.56, w = 0.8, h = 0.16, shade = 0.7 },
    { draw = "fill", x = 0.1, y = 0.8, w = 0.8, h = 0.14, shade = 0.55 },
]
path_cost = 100
portal = { cost = 250 }
build = { menu = "dig", work = 120, free = true, dig = {} }

