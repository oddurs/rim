# The levels below the surface (DESIGN.md §6d). Each [[stratum]] fills one
# level with patches of its terrains; the deepest one sets how far down the
# map goes, so a mod adds a level by adding a stratum. Every level down asks
# something new: soft ground and clay first, then stone and water, then the
# hard rock with iron in it.
#
# Rock is terrain until someone works it: then its `solid.thing` stands in
# the cell, and mining it leaves `solid.leaves`. The things are below the
# terrains, with the harvests (and so the tool gates) mods patch.

[[stratum]]
id = "soil"
level = -1
edge = "bedrock"
fill = [
    { terrain = "packed_earth", weight = 6 },
    { terrain = "clay", weight = 4, under = ["marsh", "shallow_water", "deep_water", "rich_soil"] },
    { terrain = "chalk", weight = 1 },
]

[[stratum]]
id = "limestone"
level = -2
edge = "bedrock"
fill = [
    { terrain = "limestone", weight = 6 },
    { terrain = "wet_limestone", weight = 4, under = ["marsh", "shallow_water", "deep_water", "rich_soil"] },
    { terrain = "granite", weight = 1 },
]

[[stratum]]
id = "deep"
level = -3
edge = "bedrock"
patch = 18.0
fill = [
    { terrain = "granite", weight = 8 },
    { terrain = "limestone", weight = 1 },
]

