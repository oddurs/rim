# Plants and rocks. Natural things never count toward colony wealth.

[[thing]]
id = "tree_oak"
height = 2.0
blocks_wind = 0.5
label = "oak tree"
color = "#2c5a26"
category = "plant"
look.layers = [
    { draw = "disc", r = 0.42 },
    { draw = "disc", x = 0.4, y = 0.4, r = 0.22, shade = 1.25 },
]
natural = true
path_cost = 60
harvest = { designation = "chop", work = 280, yields = [{ thing = "wood", count = 20 }] }
spawn = { terrain = ["grass", "rich_soil"], density = 0.06, spread = true }

# An oak grows in the warm half of the year, by day, faster on good soil:
# a seedling is a tree in about a month of summer. Felled young, it yields
# by how grown it is. The weather plugin adds the ground's wetness.
[thing.grow]
days = 16

[thing.grow.rate.growth]
of = [
  { field = "temperature", curve = [[2, 0.0], [8, 0.5], [16, 1.0], [28, 1.0], [36, 0.0]] },
  { field = "light", curve = [[0, 0.0], [30, 1.0]] },
  { terrain = "fertility", curve = [[0, 0.2], [1, 1.0], [1.4, 1.2]] },
]

[[thing]]
id = "berry_bush"
height = 0.4
blocks_wind = 0.2
label = "berry bush"
color = "#3f7a35"
category = "plant"
# Berries while it has them; small, dry and bare once picked, so it
# doesn't read as food.
look.layers = [
    { draw = "disc", r = 0.36 },
    { draw = "disc", x = 0.36, y = 0.4, r = 0.085, min_px = 2.0, color = "#eb2d55" },
    { draw = "disc", x = 0.63, y = 0.38, r = 0.085, min_px = 2.0, color = "#eb2d55" },
    { draw = "disc", x = 0.5, y = 0.64, r = 0.085, min_px = 2.0, color = "#eb2d55" },
    { draw = "disc", x = 0.66, y = 0.6, r = 0.085, min_px = 2.0, color = "#eb2d55" },
    { draw = "disc", x = 0.35, y = 0.6, r = 0.085, min_px = 2.0, color = "#eb2d55" },
]
look.regrowing = [{ draw = "disc", r = 0.24, color = "#575b20" }]
natural = true
harvest = { designation = "harvest", work = 180, destroy = false, yields = [{ thing = "berries", count = 8 }] }
spawn = { terrain = ["grass", "rich_soil"], density = 0.008, spread = true }

# Picked, a bush is cut back to 40% and its berries come with it: two or
# three spring days (it grows only by day), and none in the cold, so
# winter has no berries.
[thing.grow]
days = 1.5
after_harvest = 0.4

[thing.grow.rate.growth]
of = [
  { field = "temperature", curve = [[3, 0.0], [8, 0.5], [15, 1.0], [28, 1.0], [34, 0.0]] },
  { field = "light", curve = [[0, 0.0], [30, 1.0]] },
  { terrain = "fertility", curve = [[0, 0.2], [1, 1.0], [1.4, 1.2]] },
]

[[thing]]
id = "granite"
blocks_wind = 1.0
label = "granite"
color = "#7d776f"
category = "rock"
# Rock is a mass too: an outcrop reads as one body, rounded at its edges.
look.join = { group = "rock", round = 0.3 }
look.layers = [{ draw = "mass", vary = 0.12 }, { draw = "pattern", pattern = "crag" }, { draw = "edges", line = "medium", shade = 0.6 }]
natural = true
blocks = true
# Overhead rock holds a cave's roof: a room dug into it is sheltered.
support = { span = 5 }
hp = 500
harvest = { designation = "mine", work = 500, yields = [{ thing = "stone", count = 10 }] }
