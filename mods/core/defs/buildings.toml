# Anything with [build] shows up in the build toolbar under its `menu`.

# One wall, built out of whatever is structural. hp, work and colour are
# the wall's own; the material scales them (0213) and tints it (0220).
[[thing]]
id = "wall"
blocks_wind = 1.0
label = "wall"
color = "#7a5230"
category = "building"
# Walls, windows and doors join up: a run reads as one wall with
# openings in it, outlined only where it faces something else.
look.join = "wall"
# It rises as it is built, and gets its edges as it's finished.
look.layers = [{ draw = "fill", grow = [0.0, 0.85] }, { draw = "edges", width = 1.5, shade = 0.65, grow = [0.85, 1.0] }]
blocks = true
hp = 200
market_value = 8
build = { menu = "structure", work = 180, stuff = { category = "structural", count = 5 } }
boundary = [{ field = "temperature", leak = 1.0 }]

[[thing]]
id = "door"
blocks_wind = 1.0
label = "door"
color = "#b07a45"
category = "building"
look.join = "wall"
look.layers = [
    { draw = "fill", x = 0.08, y = 0.08, w = 0.84, h = 0.84 },
    { draw = "fill", x = 0.45, y = 0.1, w = 0.1, h = 0.8, shade = 0.6 },
]
door = true
path_cost = 60
hp = 150
market_value = 15
build = { menu = "structure", work = 300, stuff = { category = "structural", count = 10 } }
# A door is the draughty part of a wall.
boundary = [{ field = "temperature", leak = 1.5 }]

# A wall with a pane in it: shut to feet, open to daylight, and the
# draughtiest thing in the room. Built of the frame's material; the pane is
# implied, since nothing in core makes glass yet.
[[thing]]
id = "window"
blocks_wind = 1.0
label = "window"
color = "#9a7b58"
category = "building"
look.join = "wall"
look.layers = [
    { draw = "fill" },
    { draw = "fill", x = 0.2, y = 0.2, w = 0.6, h = 0.6, color = "#bfe0ffe6" },
    { draw = "edges", width = 1.5, shade = 0.65 },
]
blocks = true
hp = 60
market_value = 12
build = { menu = "structure", work = 220, stuff = { category = "structural", count = 3 } }
boundary = [{ field = "light", pass = 0.35 }, { field = "temperature", leak = 4.0 }]

[[thing]]
id = "bed"
label = "bed"
color = "#8c5a3a"
category = "building"
look.layers = [
    { draw = "fill", x = 0.12, y = 0.05, w = 0.76, h = 0.9 },
    { draw = "fill", x = 0.18, y = 0.1, w = 0.64, h = 0.22, color = "#e6e1d2" },
]
market_value = 40
bed = { rest_rate = 1.8 }
spots = [{ dx = 0, dy = 0 }]
build = { menu = "furniture", work = 500, stuff = { category = "structural", count = 25 } }

# Built ground. It lives under everything else and only changes what a
# step costs: two of anything structural makes a floor faster than grass.
[[thing]]
id = "floor"
label = "floor"
color = "#a08a6a"
category = "floor"
# Flat, in the material's colour, with a faint tile seam.
look.layers = [
    { draw = "fill", shade = 0.92 },
    { draw = "fill", y = 0.5, h = 0.0, min_px = 1.0, shade = 0.82 },
    { draw = "fill", x = 0.5, w = 0.0, min_px = 1.0, shade = 0.82 },
]
path_cost = 70
hp = 60
market_value = 3
build = { menu = "structure", work = 60, stuff = { category = "structural", count = 2 } }

# Furniture is passable at a cost rather than blocking: a chair has to be
# stood on to be sat in, and a blocking piece inside a room would count as
# part of its boundary. Every piece is built of whatever is structural.

[[thing]]
id = "table"
label = "table"
color = "#8c6a48"
category = "building"
# A slab on two legs.
look.layers = [
    { draw = "fill", x = 0.14, y = 0.55, w = 0.1, h = 0.35, shade = 0.6 },
    { draw = "fill", x = 0.76, y = 0.55, w = 0.1, h = 0.35, shade = 0.6 },
    { draw = "fill", x = 0.06, y = 0.3, w = 0.88, h = 0.28 },
]
path_cost = 80
hp = 120
market_value = 25
tags = ["table"]
build = { menu = "furniture", work = 200, stuff = { category = "structural", count = 10 } }

# A seat, when it stands beside a table; a stool in a field otherwise.
[[thing]]
id = "chair"
label = "chair"
color = "#a07a50"
category = "building"
# A seat with a back.
look.layers = [
    { draw = "fill", x = 0.28, y = 0.15, w = 0.44, h = 0.18, shade = 0.7 },
    { draw = "fill", x = 0.25, y = 0.4, w = 0.5, h = 0.3 },
    { draw = "fill", x = 0.3, y = 0.7, w = 0.08, h = 0.22, shade = 0.6 },
    { draw = "fill", x = 0.62, y = 0.7, w = 0.08, h = 0.22, shade = 0.6 },
]
path_cost = 40
hp = 80
market_value = 10
spots = [{ dx = 0, dy = 0, beside = "table" }]
build = { menu = "furniture", work = 100, stuff = { category = "structural", count = 4 } }

# Warms a room a little harder than a campfire and holds it a little
# warmer, with less light. It does not cook: that needs bills, which live
# outside core (DESIGN.md 5).
[[thing]]
id = "stove"
label = "stove"
color = "#5a534d"
category = "building"
# A box with a warm mouth; steady, unlike a fire.
look.layers = [
    { draw = "fill", x = 0.12, y = 0.12, w = 0.76, h = 0.76, shade = 0.85 },
    { draw = "outline", x = 0.12, y = 0.12, w = 0.76, h = 0.76, width = 1.5, shade = 0.5 },
    { draw = "fill", x = 0.3, y = 0.45, w = 0.4, h = 0.3, color = "#ff963c" },
]
path_cost = 90
hp = 150
market_value = 35
build = { menu = "furniture", work = 250, stuff = { category = "structural", count = 12 } }
emit = [
    { field = "temperature", amount = 14.0, radius = 4, cap = 26.0 },
    { field = "light", amount = 30.0, radius = 3 },
]

[[thing]]
id = "campfire"
label = "campfire"
color = "#e07b2a"
category = "building"
look.layers = [
    { draw = "disc", r = 0.38, color = "#463c37" },
    { draw = "disc", r = 0.24, pulse = 0.08 },
    { draw = "disc", r = 0.12, pulse = 0.08, color = "#ffdc78" },
]
market_value = 20
build = { menu = "furniture", work = 150, cost = [{ thing = "wood", count = 15 }] }
emit = [
    { field = "temperature", amount = 12.0, radius = 5, cap = 24.0 },
    { field = "light", amount = 80.0, radius = 7 },
]
