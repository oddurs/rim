# Anything with [build] shows up in the build toolbar under its `menu`.

[[thing]]
id = "wall_wood"
label = "wooden wall"
color = "#7a5230"
category = "building"
shape = "wall"
blocks = true
hp = 200
market_value = 8
build = { menu = "structure", work = 180, cost = [{ thing = "wood", count = 5 }] }

[[thing]]
