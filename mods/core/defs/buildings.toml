# Anything with [build] shows up in the build toolbar under its `menu`.

# One wall, built out of whatever is structural. hp, work and colour are
# the wall's own; the material scales them (0213) and tints it (0220).
[[thing]]
id = "wall"
label = "wall"
color = "#7a5230"
category = "building"
shape = "wall"
blocks = true
hp = 200
market_value = 8
build = { menu = "structure", work = 180, stuff = { category = "structural", count = 5 } }
boundary = [{ field = "temperature", leak = 1.0 }]

[[thing]]
id = "door"
label = "door"
color = "#b07a45"
category = "building"
shape = "door"
door = true
path_cost = 60
hp = 150
market_value = 15
build = { menu = "structure", work = 300, stuff = { category = "structural", count = 10 } }
# A door is the draughty part of a wall.
boundary = [{ field = "temperature", leak = 1.5 }]

[[thing]]
id = "bed"
label = "bed"
color = "#8c5a3a"
category = "building"
shape = "bed"
market_value = 40
bed = { rest_rate = 1.8 }
build = { menu = "furniture", work = 500, stuff = { category = "structural", count = 25 } }

[[thing]]
id = "campfire"
label = "campfire"
color = "#e07b2a"
category = "building"
shape = "fire"
market_value = 20
build = { menu = "furniture", work = 150, cost = [{ thing = "wood", count = 15 }] }
emit = [
    { field = "temperature", amount = 12.0, radius = 5, cap = 24.0 },
    { field = "light", amount = 80.0, radius = 7 },
]
