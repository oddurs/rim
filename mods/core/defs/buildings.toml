# Anything with [build] shows up in the build toolbar under its `menu`.

# One wall, built out of whatever is structural. hp, work and colour are
# the wall's own; the material scales them (0213) and tints it (0220).
[[thing]]
id = "wall"
blocks_wind = 1.0
label = "wall"
color = "#7a5230"
category = "building"
# Walls, windows and doors join up: a run reads as one mass with
# openings in it, rounded where it ends and outlined only where it faces
# something else (DESIGN.md §6c).
look.join = { group = "wall", round = 0.22 }
# It rises as it is built, and gets its outline as it's finished.
# The material shows as a pattern once it stands: logs, courses, weave.
look.layers = [
    { draw = "mass", grow = [0.0, 0.8] },
    { draw = "pattern", grow = [0.8, 0.9] },
    { draw = "edges", line = "heavy", shade = 0.55, grow = [0.9, 1.0] },
]
blocks = true
hp = 200
market_value = 8
build = { menu = "structure", work = 180, stuff = { category = "structural", count = 5 } }
# Holds the roof up for 4 cells, times its material's span (DESIGN.md §6c).
support = { span = 4 }
boundary = [{ field = "temperature", leak = 1.0 }]

[[thing]]
id = "door"
blocks_wind = 1.0
label = "door"
color = "#b07a45"
category = "building"
# Drawn as a plan draws a door: the wall's two ends, and the leaf standing
# open into the room with the arc it swings through. Written for a wall
# running east to west with the room to the south; it turns to its wall
# and mirrors toward the room by itself (DESIGN.md §6c).
look.join = "wall"
look.orient = "run"
look.layers = [
    { draw = "fill", w = 0.12, shade = 0.75 },
    { draw = "fill", x = 0.88, w = 0.12, shade = 0.75 },
    { draw = "arc", x = 0.12, r = 0.76, from = 0, to = 90, line = "light", shade = 0.45, into = "room" },
    { draw = "fill", x = 0.12, y = 0.5, w = 0.1, h = 0.76, shade = 0.5, into = "room" },
    { draw = "fill", x = 0.14, y = 0.52, w = 0.06, h = 0.72, shade = 1.1, into = "room" },
]
door = true
path_cost = 60
hp = 150
market_value = 15
build = { menu = "structure", work = 300, stuff = { category = "structural", count = 10 } }
# A door is the draughty part of a wall.
# Holds the roof up for 4 cells, times its material's span (DESIGN.md §6c).
support = { span = 4 }
boundary = [{ field = "temperature", leak = 1.5 }]

# A wall with a pane in it: shut to feet, open to daylight, and the
# draughtiest thing in the room. Built of the frame's material; the pane is
# implied, since nothing in core makes glass yet.
[[thing]]
id = "window"
blocks_wind = 1.0
label = "window"
color = "#9a7b58"
category = "building"
# The wall with a pane across it, as a plan draws a window: two faces of
# glass and the frame's line down the middle, turned to follow its wall.
look.join = { group = "wall", round = 0.22 }
look.orient = "run"
look.layers = [
    { draw = "mass" },
    { draw = "pattern" },
    { draw = "fill", y = 0.36, h = 0.28, color = "#c4e4ffe6" },
    { draw = "fill", y = 0.36, h = 0.0, min_px = 1.0, shade = 0.5 },
    { draw = "fill", y = 0.64, h = 0.0, min_px = 1.0, shade = 0.5 },
    { draw = "fill", y = 0.5, h = 0.0, min_px = 1.0, color = "#5a8cc8" },
    { draw = "edges", line = "heavy", shade = 0.55 },
]
blocks = true
hp = 60
market_value = 12
build = { menu = "structure", work = 220, stuff = { category = "structural", count = 3 } }
# Holds the roof up for 4 cells, times its material's span (DESIGN.md §6c).
support = { span = 4 }
boundary = [{ field = "light", pass = 0.35 }, { field = "temperature", leak = 4.0 }]

[[thing]]
id = "bed"
label = "bed"
color = "#8c5a3a"
category = "building"
# Furniture is a plan symbol (DESIGN.md §6c): outlined in ink at the
# light weight, in its material's colour. A bed's head is its north end.
look.layers = [
    { draw = "box", x = 0.1, y = 0.04, w = 0.8, h = 0.92, round = 0.07, shade = 1.05 },
    { draw = "box", x = 0.16, y = 0.4, w = 0.68, h = 0.5, round = 0.04, color = "#b9ae95" },
    { draw = "line", start = [0.16, 0.56], end = [0.84, 0.56], line = "hair", color = "#8a806a" },
    { draw = "box", x = 0.22, y = 0.1, w = 0.56, h = 0.22, round = 0.1, color = "#ece6d6" },
]
tags = ["bed"]
market_value = 40
bed = { rest_rate = 1.8 }
spots = [{ dx = 0, dy = 0 }]
build = { menu = "furniture", work = 500, stuff = { category = "structural", count = 25 } }

# Built ground. It lives under everything else and only changes what a
# step costs: two of anything structural makes a floor faster than grass.
[[thing]]
id = "floor"
label = "floor"
color = "#a08a6a"
category = "floor"
# Flat, in the material's colour, laid in its floor pattern: planks,
# flagstones, strewn rushes.
look.layers = [{ draw = "fill", shade = 0.92 }, { draw = "pattern", pattern = "floor" }]
path_cost = 70
hp = 60
market_value = 3
build = { menu = "structure", work = 60, stuff = { category = "structural", count = 2 } }

# Furniture is passable at a cost rather than blocking: a chair has to be
# stood on to be sat in, and a blocking piece inside a room would count as
# part of its boundary. Every piece is built of whatever is structural.

[[thing]]
id = "table"
label = "table"
color = "#8c6a48"
category = "building"
# Its top, seen from above, with the grain of its boards.
look.layers = [
    { draw = "box", x = 0.06, y = 0.14, w = 0.88, h = 0.72, shade = 1.08 },
    { draw = "line", start = [0.14, 0.38], end = [0.86, 0.38], line = "hair", shade = 0.7 },
    { draw = "line", start = [0.14, 0.62], end = [0.86, 0.62], line = "hair", shade = 0.7 },
]
path_cost = 80
hp = 120
market_value = 25
tags = ["table"]
build = { menu = "furniture", work = 200, stuff = { category = "structural", count = 10 } }

# A seat, when it stands beside a table; a stool in a field otherwise.
[[thing]]
id = "chair"
label = "chair"
color = "#a07a50"
category = "building"
# A seat and its back, seen from above.
# It turns to face the table beside it, however it was placed.
look.face = "beside:table"
look.layers = [
    { draw = "box", x = 0.26, y = 0.36, w = 0.48, h = 0.44, round = 0.07, shade = 1.1 },
    { draw = "box", x = 0.2, y = 0.16, w = 0.6, h = 0.14, round = 0.04, shade = 0.8 },
]
path_cost = 40
hp = 80
tags = ["seat"]
market_value = 10
spots = [{ dx = 0, dy = 0, beside = "table" }]
build = { menu = "furniture", work = 100, stuff = { category = "structural", count = 4 } }

# Warms a room a little harder than a campfire and holds it a little
# warmer, with less light. It does not cook: that needs bills, which live
# outside core (DESIGN.md 5).
[[thing]]
id = "stove"
label = "stove"
color = "#5a534d"
category = "building"
# Its body, its firebox and the steady glow inside, unlike a fire's.
look.layers = [
    { draw = "box", x = 0.1, y = 0.1, w = 0.8, h = 0.8, round = 0.08, shade = 0.85 },
    { draw = "box", x = 0.26, y = 0.26, w = 0.48, h = 0.48, round = 0.1, color = "#2a211c" },
    { draw = "disc", r = 0.15, color = "#ff8c3a" },
    { draw = "disc", y = 0.52, r = 0.07, color = "#ffd27a" },
]
path_cost = 90
hp = 150
tags = ["fire"]
market_value = 35
build = { menu = "furniture", work = 250, stuff = { category = "structural", count = 12 } }
emit = [
    { field = "temperature", amount = 14.0, radius = 4, cap = 26.0 },
    { field = "light", amount = 30.0, radius = 3 },
]
glow = { flicker = "steady" }

