# Terrain. `path_cost` is movement cost in percent; 0 is impassable.
# Map generation picks the highest-priority band containing the cell's
# elevation and moisture (both 0..1).

[[terrain]]
id = "deep_water"
label = "deep water"
color = "#1f4e79"
path_cost = 0
gen = { elevation = [0.0, 0.22], priority = 10 }

[[terrain]]
id = "shallow_water"
label = "shallow water"
color = "#3d7ab8"
path_cost = 300
gen = { elevation = [0.22, 0.28], priority = 9 }

[[terrain]]
