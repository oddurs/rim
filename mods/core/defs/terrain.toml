# Terrain. `path_cost` is movement cost in percent; 0 is impassable.
# Map generation picks the highest-priority band containing the cell's
# elevation and moisture (both 0..1).
#
# `props` are numbers terms read with `{ terrain = "fertility" }`; one a
# terrain doesn't give reads 0. Core's:
#   fertility    how well plants grow, 1 on grass
#   drainage     how fast standing water leaves, 0 to 1
#   water_table  how near the ground water is, 0 (dry) to 1 (at the surface)
# `tags` are what `{ near = "water" }` measures the distance to.

[[terrain]]
id = "deep_water"
label = "deep water"
color = "#1f4e79"
path_cost = 0
# The water table: dug space beside or under it floods (DESIGN.md §6d).
pours = 7
props = { fertility = 0.0, drainage = 0.0, water_table = 1.0 }
tags = ["water"]
gen = { elevation = [0.0, 0.22], priority = 10 }

[[terrain]]
id = "shallow_water"
label = "shallow water"
color = "#3d7ab8"
path_cost = 300
pours = 4
props = { fertility = 0.0, drainage = 0.0, water_table = 1.0 }
tags = ["water"]
gen = { elevation = [0.22, 0.28], priority = 9 }

[[terrain]]
id = "sand"
label = "sand"
color = "#cdbb85"
path_cost = 130
props = { fertility = 0.2, drainage = 0.9, water_table = 0.2 }
gen = { elevation = [0.28, 0.32], priority = 8 }

# Rock fills its cell (DESIGN.md §6d). It is terrain until someone works
# it: then its thing stands in the cell, and mining it leaves `leaves`.
[[terrain]]
id = "granite"
label = "granite"
color = "#7d776f"
solid = { thing = "granite", leaves = "rock_floor" }
props = { fertility = 0.0, drainage = 0.0, water_table = 0.0 }
gen = { elevation = [0.74, 1.0], priority = 10 }

[[terrain]]
id = "rock_floor"
label = "rough stone"
color = "#5e5a55"
props = { fertility = 0.0, drainage = 0.3, water_table = 0.0 }

[[terrain]]
id = "marsh"
