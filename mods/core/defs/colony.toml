[[need]]
id = "food"
label = "food"
color = "#d9a441"
satisfier = "food"
days_to_empty = 2.0
seek_below = 0.35
empty_damage_per_day = 30
say = { below = 0.2, lines = ["I'm starving.", "So hungry…", "When did I last eat?"] }

[[need]]
id = "rest"
label = "rest"
color = "#6a8fd6"
satisfier = "rest"
days_to_empty = 1.2
seek_below = 0.25
say = { below = 0.12, lines = ["I can barely keep my eyes open.", "So tired…", "I need to lie down."] }

# Warmth drains when it's too cold (or hot), faster the further outside
# comfort; days_to_empty is the rate at 10° outside it.
[[need]]
id = "warmth"
label = "warmth"
color = "#e07a3a"
satisfier = "field"
# How cold it feels, wind and rain included, not the thermometer.
field = "feels_like"
comfort = [10.0, 32.0]
days_to_empty = 0.2
recover_days = 0.1
say = { below = 0.3, lines = ["I'm freezing.", "Can't feel my fingers.", "It's so cold."] }
seek_below = 0.35
empty_damage_per_day = 40

# Work types: the columns of the priority grid (DESIGN.md §4d). A colonist
# does the work at its lowest priority level that has something reachable;
# 1 is first, 0 never. `order` breaks ties; `jobs = ["build"]` is the work
# type that raises blueprints and brings them materials; `jobs = ["haul"]`
# the one that carries loose items to stockpiles.
# Skills: what colonists get better at by doing it. A work type names the
# skill it trains; the one with `melee = true` is what fighting trains.
[[skill]]
id = "construction"
label = "Construction"

[[skill]]
id = "mining"
label = "Mining"

[[skill]]
id = "plants"
label = "Plants"

[[skill]]
id = "melee"
label = "Melee"
melee = true

# Levels by name (DESIGN.md §4d). A mod that patches `levels` patches
# `labels` with it, or empties them and the board shows numbers.
[[priority_scale]]
id = "core"
levels = 4
labels = ["First", "Soon", "Later", "Spare time"]

[[work_type]]
id = "build"
label = "Build"
icon = "B"
skill = "construction"
priority = 3
order = 10
jobs = ["build"]
auto = { per_person = 4, weight = 4 }

[[work_type]]
id = "mine"
label = "Mine"
icon = "M"
skill = "mining"
priority = 3
order = 20
auto = { per_person = 6, weight = 1 }

[[work_type]]
id = "chop"
label = "Chop"
icon = "C"
skill = "plants"
priority = 3
order = 30
auto = { per_person = 4, weight = 2 }

[[work_type]]
id = "harvest"
label = "Harvest"
icon = "H"
skill = "plants"
priority = 3
order = 40
auto = { per_person = 5, weight = 3 }

[[work_type]]
id = "hunt"
label = "Hunt"
icon = "U"
skill = "melee"
priority = 3
order = 50
auto = { per_person = 1, weight = 2 }

# Carrying loose items to the stockpiles that take them.
[[work_type]]
id = "haul"
label = "Haul"
icon = "L"
priority = 3
order = 60
jobs = ["haul"]
auto = { per_person = 8, weight = 1 }

# Work roles (DESIGN.md §4d): a partial set of levels colonists belong to,
# one role each; what a role leaves out is the work type's default, and a
# colonist's own setting (a pin) beats it. The first by `order` is where
# colonists start. The colony keeps its own copy of each, which the player
# edits; mods add roles or patch these (`work_role/core:builder`).
# Auto: where colonists start. Its levels are planned hourly by
# scripts/auto.luau from skill and what's waiting, around the colonists
# in other roles and every pin. A mod replaces the policy by patching
# `planner`.
[[work_role]]
id = "auto"
label = "Auto"
order = -10
planner = "core:auto"

[[work_role]]
id = "hand"
label = "Hand"
order = 0

[[work_role]]
id = "builder"
label = "Builder"
order = 10
priorities = { build = 1, mine = 2, haul = 2, hunt = 0 }

[[work_role]]
id = "forager"
label = "Forager"
order = 20
priorities = { harvest = 1, hunt = 1, chop = 2 }

# Stances: named sets of priority rules the colony switches with one
# click (DESIGN.md §4d). A rule holds while its `when` does (an hour range,
# seasons, a stance, a colonist's need) and `shift`s work types (negative is
# sooner) or `set`s them. The first stance by `order` is where a colony
# starts. Mods add stances and rules, or rules for core's stances.
[[stance]]
id = "normal"
label = "Normal"
order = 0

[[stance]]
id = "harvest"
label = "Harvest"
order = 10

[[stance]]
id = "winter_prep"
label = "Winter prep"
order = 20

[[stance]]
id = "siege"
label = "Siege"
order = 30

[[priority_rule]]
id = "harvest"
when = { stance = "harvest" }
shift = { harvest = -2, haul = -1, mine = 1 }

[[priority_rule]]
id = "winter_prep"
when = { stance = "winter_prep" }
shift = { chop = -2, harvest = -1, build = -1 }

# Stay inside the walls and raise more of them.
[[priority_rule]]
id = "siege"
when = { stance = "siege" }
set = { hunt = 0 }
shift = { build = -2, chop = 1, mine = 1 }

# Standing orders (DESIGN.md §4d): rules on colony readings, which
# scripts/readings.luau publishes hourly. Each turns on past one mark and
# off past the other, so it doesn't flap, and the colony can switch any of
# them off. They shift everyone, whatever their role.
[[priority_rule]]
id = "food_low"
label = "Food is low"
when = { reading = "core:food_days", below = 5, until = 8 }
shift = { harvest = -1, hunt = -1 }

[[priority_rule]]
id = "loose_items"
label = "Loose items piling up"
when = { reading = "core:loose_items", above = 30, until = 10 }
shift = { haul = -1 }

# Core's fires burn nothing yet, so winter's want is wood to build with.
[[priority_rule]]
id = "wood_for_winter"
label = "Wood before winter"
when = { season = ["autumn"], reading = "core:wood", below = 60, until = 120 }
shift = { chop = -1 }

[[designation]]
id = "chop"
label = "Chop"
color = "#6fbf4a"
work_type = "chop"
style = "chopping"

[[designation]]
id = "mine"
label = "Mine"
color = "#b0a89e"
work_type = "mine"
style = "mining"

[[designation]]
id = "harvest"
label = "Harvest"
color = "#d64a6a"
work_type = "harvest"
style = "picking"

# Take what a thing gives without taking the thing: branches off a tree,
# stones off the ground. Core's own things have no gather harvest; it's
# here so plugins agree on one (DESIGN.md §5 rule 2, §4e).
[[designation]]
id = "gather"
label = "Gather"
color = "#c9a25e"
work_type = "harvest"
style = "picking"

[[designation]]
id = "deconstruct"
label = "Deconstruct"
color = "#c9a24a"
targets = "built"
work_type = "build"
style = "dismantling"

[[designation]]
id = "hunt"
label = "Hunt"
color = "#e05030"
targets = "creature"
work_type = "hunt"

# The one and only start: a lone naked warrior with nothing.
[[start]]
id = "warrior"
creature = "human"
title = "the warrior"
founder_damage_bonus = 5

[[names]]
id = "core"
names = ["Kael", "Brynja", "Oddur", "Sigrun", "Tarn", "Idris", "Maren", "Ulf", "Asha", "Corin", "Hekla", "Joren",
         "Liv", "Ragna", "Soren", "Tove", "Yrsa", "Bram", "Eira", "Gunnar", "Hallr", "Ines", "Kari", "Nyx"]

# How work on a cell looks (DESIGN.md §6b, docs/modding/looks.md). `every`
# is the work between two strikes; the rest name client mechanisms.
[[work_style]]
id = "chopping"
every = 30
strike = ["shake", "chips", "shed"]
wear = "lean"
exit = "fall"

[[work_style]]
id = "mining"
every = 40
strike = ["shake", "chips", "dust"]
wear = "cracks"
exit = "crumble"

[[work_style]]
id = "building"
every = 20
strike = ["dust", "chips"]
wear = "grow"
builds = true

[[work_style]]
id = "picking"
every = 30
strike = ["shed"]

# A wall blocks until it is gone, so it cracks rather than shrinks.
[[work_style]]
id = "dismantling"
every = 25
strike = ["shake", "dust", "chips"]
wear = "cracks"
exit = "pop"
