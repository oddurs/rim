[[need]]
id = "food"
label = "food"
color = "#d9a441"
satisfier = "food"
days_to_empty = 2.0
seek_below = 0.35
empty_damage_per_day = 30

[[need]]
id = "rest"
label = "rest"
color = "#6a8fd6"
satisfier = "rest"
days_to_empty = 1.2
seek_below = 0.25

# Warmth drains when it's too cold (or hot), faster the further outside
# comfort; days_to_empty is the rate at 10° outside it.
[[need]]
id = "warmth"
label = "warmth"
color = "#e07a3a"
satisfier = "field"
field = "temperature"
comfort = [10.0, 32.0]
days_to_empty = 0.2
recover_days = 0.1
seek_below = 0.35
empty_damage_per_day = 40

# Work types: the columns of the priority grid (DESIGN.md §4d). A colonist
# does the work at its lowest priority level that has something reachable;
# 1 is first, 0 never. `order` breaks ties; `jobs = ["build"]` is the work
# type that raises blueprints and brings them materials; `jobs = ["haul"]`
# the one that carries loose items to stockpiles.
[[priority_scale]]
id = "core"
levels = 4

[[work_type]]
id = "build"
label = "Build"
icon = "B"
skill = "construction"
priority = 3
order = 10
jobs = ["build"]

[[work_type]]
id = "mine"
label = "Mine"
icon = "M"
skill = "mining"
priority = 3
order = 20

[[work_type]]
id = "chop"
label = "Chop"
icon = "C"
skill = "plants"
priority = 3
order = 30

[[work_type]]
id = "harvest"
label = "Harvest"
icon = "H"
skill = "plants"
priority = 3
order = 40

[[work_type]]
id = "hunt"
label = "Hunt"
icon = "U"
skill = "shooting"
priority = 3
order = 50

# Carrying loose items to the stockpiles that take them.
[[work_type]]
id = "haul"
label = "Haul"
icon = "L"
priority = 3
order = 60
jobs = ["haul"]

[[designation]]
id = "chop"
label = "Chop"
color = "#6fbf4a"
work_type = "chop"
style = "chopping"

[[designation]]
id = "mine"
label = "Mine"
color = "#b0a89e"
work_type = "mine"
style = "mining"

[[designation]]
id = "harvest"
label = "Harvest"
color = "#d64a6a"
work_type = "harvest"
style = "picking"

# Take what a thing gives without taking the thing: branches off a tree,
# stones off the ground. Core's own things have no gather harvest; it's
# here so plugins agree on one (DESIGN.md §5 rule 2, §4e).
[[designation]]
id = "gather"
label = "Gather"
color = "#c9a25e"
work_type = "harvest"
style = "picking"

[[designation]]
id = "deconstruct"
label = "Deconstruct"
color = "#c9a24a"
targets = "built"
work_type = "build"
style = "dismantling"

[[designation]]
id = "hunt"
label = "Hunt"
color = "#e05030"
targets = "creature"
work_type = "hunt"

# The one and only start: a lone naked warrior with nothing.
[[start]]
id = "warrior"
creature = "human"
title = "the warrior"
founder_damage_bonus = 5

[[names]]
id = "core"
names = ["Kael", "Brynja", "Oddur", "Sigrun", "Tarn", "Idris", "Maren", "Ulf", "Asha", "Corin", "Hekla", "Joren",
         "Liv", "Ragna", "Soren", "Tove", "Yrsa", "Bram", "Eira", "Gunnar", "Hallr", "Ines", "Kari", "Nyx"]

# How work on a cell looks (DESIGN.md §6b, docs/modding/looks.md). `every`
# is the work between two strikes; the rest name client mechanisms.
[[work_style]]
id = "chopping"
every = 30
strike = ["shake", "chips", "shed"]
wear = "lean"
exit = "fall"

[[work_style]]
id = "mining"
every = 40
strike = ["shake", "chips", "dust"]
wear = "cracks"
exit = "crumble"

[[work_style]]
id = "building"
every = 20
strike = ["dust", "chips"]
wear = "grow"
builds = true

[[work_style]]
id = "picking"
every = 30
strike = ["shed"]

# A wall blocks until it is gone, so it cracks rather than shrinks.
[[work_style]]
id = "dismantling"
every = 25
strike = ["shake", "dust", "chips"]
wear = "cracks"
exit = "pop"
