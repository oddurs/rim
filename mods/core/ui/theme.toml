# Core theme: every visual value the UI uses. Plain and minimal:
# translucent dark surfaces over the world, 1 px hairlines, one accent.
# Any mod can override a token in its own ui/theme.toml.
# Sizes are logical pixels; the engine multiplies by DPI and UI scale.

[font]
# Inter, shipped in ui/fonts (SIL OFL 1.1, Inter-LICENSE.txt): the same
# letters on every platform. Empty would be the operating system's UI font.
family = "Inter"

[space]            # a 4 px grid
xxs = 1
xs = 2
s = 4
m = 8
l = 12
xl = 16
xxl = 24
# The same grid by role, so a gap says what it separates.
hair = 2    # a label and its sub-line: name over job, message over time
tight = 4   # rows in a list; a reading's name over its value
item = 8    # separate things: messages, alerts, a label and its content;
            # a panel's top and bottom inset
inset = 12  # a panel's side inset; between readings in a row
panel = 8   # between panels stacked in a region
group = 16  # between groups inside a sheet

[text]
caption = 11   # section labels and reading names, uppercase and tracked
small = 12
body = 13
heading = 15
title = 18
display = 22   # a screen's name: the title, New colony
hero = 28      # the game's name on the title

[leading]      # line height over text size
line = 1.3     # a single line
wrap = 1.4     # text that wraps

[tracking]     # letter spacing, in em
caption = 0.06

[weight]
regular = 400
strong = 600

[shape]
radius = 4
border = 1
# The keyboard's focus ring: this wide, this far outside what has focus.
focus_ring = 2
focus_gap = 1
# World overlays (DESIGN.md §6f), in points on the map.
hair = 1             # a drag's box, a zone's edge
stroke = 1.5         # hover, a hovered or selected zone's edge
firm = 2             # selection
bracket_gap = 3      # selection sits this far outside a footprint
bracket_arm_min = 4
bracket_arm_max = 12

[color]
surface = "#121417d9"
surface_raised = "#1c1f24f2"
surface_hover = "#272b31f2"
surface_press = "#30353cf2"
line = "#ffffff22"
line_strong = "#ffffff40"
text = "#e7e7e4"
muted = "#a3a8ae"
faint = "#7b8188"
accent = "#5ab4ff"
accent_soft = "#5ab4ff2e"
accent_hover = "#7cc3ff"  # a primary button under the pointer
accent_press = "#3f9ee6"
on_accent = "#08121c"     # text on an accent fill
focus = "#5ab4ff"         # the keyboard's focus ring
good = "#72d282"
threat = "#ff6b5a"
threat_soft = "#ff6b5a26"  # a danger button under the pointer
threat_press = "#ff6b5a40"
bad = "#ffb35a"
player = "#5ab4ff"
hostile = "#ff6b5a"
track = "#ffffff14"
backdrop = "#00000073"
# World overlays (DESIGN.md §6f). Chalk is attention, hue is kind, blue is
# yours.
chalk = "#f2eee3"        # selection, the grid's lit edge
keyline = "#080a0c8c"    # under every overlay stroke, so it reads on any ground
seam = "#0000001f"       # a grid line, darkening the ground it crosses
seam_major = "#00000052" # every fifth line when measuring (G)
intent_fill = "#5ab4ff4d" # a plan's ghost; its edge is accent
zone = "#a48fe0"         # stockpiles: violet, so a plan's blue never reads as one
zone_fill = "#a48fe01f"
