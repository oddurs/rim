# What core's creatures look like from above (DESIGN.md §6h): plan figures,
# drawn in the plan's ink. Client data: a mod that redraws a creature, or
# draws its own, adds a [[body]] in its own ui/bodies.toml.
#
# A body is written facing north (forward is -y), in cells from the
# creature's centre. A part is a `disc` (`r`, `squash` fore and aft) or a
# `box` (`w`, `h`, `round`), in a colour: "#rrggbb", or a channel each
# creature fills in: @skin, @feet, @torso, @hair. `line` outlines it in ink
# at one of the plan's weights. `world` parts don't turn with the creature
# (the shadow); `detail` parts show only close up. `move` names what a gait
# moves it with. Documented in docs/modding/bodies.md.

[[body]]
id = "human"
creatures = ["human"]
parts = [
    { id = "shadow", draw = "disc", x = 0.05, y = 0.07, r = 0.26, squash = 0.88, color = "#00000042", world = true },
    { id = "foot_l", draw = "disc", x = -0.085, r = 0.06, squash = 1.45, color = "@feet", line = "hair", detail = true, move = "stride", phase = 0.0 },
    { id = "foot_r", draw = "disc", x = 0.085, r = 0.06, squash = 1.45, color = "@feet", line = "hair", detail = true, move = "stride", phase = 0.5 },
    { id = "hand_l", draw = "disc", x = -0.235, r = 0.052, color = "@skin", line = "light", detail = true, move = "swing", phase = 0.5 },
    { id = "hand_r", draw = "disc", x = 0.235, r = 0.052, color = "@skin", line = "light", detail = true, move = "swing", phase = 0.0 },
    { id = "torso", draw = "box", w = 0.5, h = 0.27, round = 1.0, color = "@torso", line = "light", move = "sway" },
    { id = "head", draw = "disc", y = -0.03, r = 0.115, color = "@skin", line = "light", move = "lean" },
    { id = "hair", draw = "disc", y = -0.012, r = 0.106, squash = 0.94, color = "@hair", line = "hair", move = "lean" },
]
sockets = { hair = "head", worn = "torso", hold = [0.0, -0.22], shoulder = [0.16, 0.0], tool = "hand_r" }
# Garment layers, innermost first: the outermost one worn colours the torso.
layers = ["body", "outer"]

