# Plants drink: the weather plugin adds the ground's wetness to core's
# plants, as one more input to their growth term (DESIGN.md §4c); ids are
# qualified, since a bare one resolves in the patched mod. Dry
# ground slows them, soaked ground a little; the rest is core's.

[[patch]]
target = "thing/core:tree_oak"

[patch.set.grow.rate.growth]
of = [
  { field = "core:temperature", curve = [[2, 0.0], [8, 0.5], [16, 1.0], [28, 1.0], [36, 0.0]] },
  { field = "core:light", curve = [[0, 0.0], [30, 1.0]] },
  { terrain = "fertility", curve = [[0, 0.2], [1, 1.0], [1.4, 1.2]] },
  { field = "weather:wetness", curve = [[0, 0.1], [25, 0.6], [45, 1.0], [90, 1.0], [100, 0.8]] },
]

[[patch]]
target = "thing/core:berry_bush"

[patch.set.grow.rate.growth]
of = [
  { field = "core:temperature", curve = [[3, 0.0], [8, 0.5], [15, 1.0], [28, 1.0], [34, 0.0]] },
  { field = "core:light", curve = [[0, 0.0], [30, 1.0]] },
  { terrain = "fertility", curve = [[0, 0.2], [1, 1.0], [1.4, 1.2]] },
  { field = "weather:wetness", curve = [[0, 0.1], [25, 0.6], [45, 1.0], [90, 1.0], [100, 0.8]] },
]
