# The weather types, as data. Any mod adds more with [[weather.type]] and
# changes these with patches (target = "weather:type/weather:storm"), like any
# def. A type's weight is `weight` x its season's entry (or `default`) x how
# well it follows the previous type (`follows`, by id); `first_day = false`
# keeps it off the first day, whose night is the shelter test.
#
# Channel units: cloud and fog in %, precipitation in mm/h, wind in m/s,
# temperature as an offset in °C on top of the seasonal curve. A number, or
# [min, max] picked once per spell.

[[kind]]
id = "type"

[kind.fields]
label = "string"
cold_label = { type = "string", default = "" }
hours = "list"
blend = { type = "float", default = 1.0 }
weight = { type = "float", default = 1.0 }
first_day = { type = "bool", default = true }
season = { type = "table", default = {} }
follows = { type = "table", default = {} }
set = "table"
message = { type = "string", default = "" }
cold_message = { type = "string", default = "" }
message_kind = { type = "string", default = "info" }

[[type]]
id = "clear"
label = "clear"
hours = [8, 26]
blend = 2
season = { spring = 3, summer = 4.5, autumn = 2.5, winter = 2.5 }
follows = { clear = 0.8, fog = 1.4 }
set = { cloud = [0, 20], precipitation = 0, wind = [0.5, 5], fog = 0, temperature = [0, 1.5] }

[[type]]
id = "cloudy"
label = "overcast"
hours = [4, 16]
blend = 2
first_day = false
season = { spring = 2.5, summer = 2, autumn = 3, winter = 3 }
follows = { cloudy = 0.6 }
set = { cloud = [65, 95], precipitation = 0, wind = [2, 7], fog = 0, temperature = [-1, 0] }

[[type]]
id = "rain"
label = "rain"
cold_label = "snow"
hours = [3, 12]
blend = 1.5
first_day = false
season = { spring = 2.2, summer = 1.2, autumn = 2.6, winter = 2 }
follows = { cloudy = 1.8, clear = 0.5, rain = 0.5 }
set = { cloud = [85, 100], precipitation = [0.8, 4], wind = [3, 9], fog = 0, temperature = [-3.5, -1.5] }
cold_message = "It's snowing."

[[type]]
id = "storm"
label = "storm"
cold_label = "blizzard"
hours = [2, 7]
blend = 1
first_day = false
season = { spring = 0.25, summer = 0.45, autumn = 0.4, winter = 0.3 }
follows = { rain = 1.8, cloudy = 1.2, clear = 0.3, storm = 0.1 }
set = { cloud = 100, precipitation = [5, 9], wind = [12, 20], fog = 0, temperature = [-6, -3] }
message = "A storm breaks. Get everyone inside."
cold_message = "A blizzard sweeps in. Get everyone inside."
message_kind = "threat"

[[type]]
id = "fog"
label = "fog"
hours = [2, 6]
blend = 1.5
first_day = false
season = { spring = 0.6, summer = 0.25, autumn = 1.1, winter = 0.7 }
follows = { rain = 1.8, fog = 0.1 }
set = { cloud = [40, 70], precipitation = 0, wind = [0, 1], fog = [60, 90], temperature = -0.5 }
